[plugin_settings."yngwe/wallpaperCarousel"]
cacheSize = 15
selectedScale = 111

[plugins]
auto_update = "all"
enabled = [
    "icefish/phone-connect",
    "yngwe/wallpaperCarousel",
    "yocraft/battery-widget",
    "noctalia/umbriel-companion",
    "ashur-d/wallpaper-widget"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    category_icons_only = true
    layout = "simple"

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = false

    [shell.shadow]
    direction = "down_left"

[system.monitor]
cpu_poll_seconds = 3
disk_poll_seconds = 12

[theme]
community_palette = "Catppuccin Mocha Mauve-Lavender"
custom_palette = "sollace-2-dys"
mode = "dark"
pure_black_dark = false
source = "community"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kitty", "qt", "umbriel", "wezterm" ]
    community_ids = [ "pywalfox", "pywalfox-beta4", "zen-browser", "musescore", "steam", "papirus-icons", "yazi" ]

[wallpaper]
directory = "/home/ashwin/dotfiles/assets/wallpaper"
fill_mode = "span"

    [wallpaper.automation]
    interval_seconds = 9

    [wallpaper.default]
    path = "/home/ashwin/dotfiles/assets/wallpaper/tree-house.jpg"

    [wallpaper.last]
    path = "/home/ashwin/dotfiles/assets/wallpaper/tree-house.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/ashwin/dotfiles/assets/wallpaper/tree-house.jpg"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.bar_2]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
color = "primary"
display_mode = "graphic"

[widget.tray]
match_adjacent_spacing = true

[widget.workspaces]
active_pill_size = 2.8000000000000003
empty_color = "tertiary"
inactive_pill_size = 1.3
