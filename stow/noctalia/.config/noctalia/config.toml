[accessibility]
ui_scale = 0.95000000670552254

[audio]
colorize_icons = true
sound_volume = 0.48999998904764652

[bar]
order = [ "TOP" ]

    [bar.TOP]
    background_opacity = 0.96999997831881046
    border = "on_hover"
    capsule = false
    capsule_fill = "on_error"
    center = [ "group:g3" ]
    color = "primary"
    end = [ "tray", "clipboard", "network", "bluetooth", "volume", "group:g5", "group:g2", "session" ]
    font_family = "JetBrainsMonoNL NFP"
    font_weight = 600
    icon_color = "primary"
    margin_ends = 13
    padding = 33
    panel_overlap = 0
    radius = 56
    radius_top_left = 0
    radius_top_right = 0
    shadow = false
    start = [ "group:g4", "group:g1", "bar" ]
    widget_spacing = 18

        [[bar.TOP.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 0.0
        enabled = true
        fill = "on_error"
        id = "g1"
        members = [ "cpu", "ram" ]
        opacity = 0.0
        padding = 0.0
        widget_spacing = 10

        [[bar.TOP.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "on_error"
        id = "g2"
        members = [ "battery", "power_profile" ]
        opacity = 0.0
        padding = 0.0
        widget_spacing = 10

        [[bar.TOP.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "on_error"
        id = "g3"
        members = [ "control-center", "clock", "notifications" ]
        opacity = 0.0
        padding = 2.0
        widget_spacing = 17

        [[bar.TOP.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.5
        enabled = true
        fill = "on_error"
        id = "g4"
        members = [ "workspaces", "bar_2" ]
        opacity = 1.0
        padding = 0.0
        widget_spacing = 11

        [[bar.TOP.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "on_error"
        id = "g5"
        members = [ "brightness", "nightlight" ]
        opacity = 1.0
        padding = 4.0
        widget_spacing = 5

[battery]
warning_threshold = 20

[bluetooth]
connection_notifications = true

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[control_center]
shortcuts = []
sidebar_section = "none"

[hooks]
session_locked = "noctalia msg media stop"

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
address = "Rupnagar,India"

