# -----------------------------
# FONT (clean + readable)
# -----------------------------
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
font_size        14

# Render Tamil block characters using a Tamil-capable fallback font.
symbol_map U+0B80-U+0BFF Noto Sans Tamil

# -----------------------------
# APPEARANCE (Konsole-like)
# -----------------------------
background_opacity 0.8
cursor_shape beam
cursor_blink_interval 0.5

# Smooth scrolling
scrollback_lines 10000

# -----------------------------
# COLORS (EndeavourOS-inspired)
# -----------------------------
foreground #E6E1F5
background #111111
transparent_background_colors #1e1e2e@0.8
## Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

ls ~/.mozilla/firefox/
# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8 
# TABS (like Konsole)
# -----------------------------
enable_tab_bar yes
tab_bar_edge top
tab_bar_style powerline
allow_remote_control yes
# -----------------------------
# KEYBINDINGS (THIS IS THE MAGIC)
# Konsole-like feel
# -----------------------------

# New tab (like Konsole Ctrl+Shift+T)
map ctrl+shift+t new_tab

# Close tab
map ctrl+shift+q close_tab

# Next / Previous tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Next / Previous tab with Ctrl+Shift+Right/Left
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Split (like Konsole) - force splits layout for consistent behavior
map ctrl+shift+d combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+shift+enter combine : goto_layout splits : launch --location=hsplit --cwd=current

# Navigate splits
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Resize splits
map ctrl+alt+left resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up resize_window taller
map ctrl+alt+down resize_window shorter

# Copy paste (normal behavior)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Close only the current split (window)
map alt+q close_window

# -----------------------------
# PERFORMANCE
# -----------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# -----------------------------
# SHELL (your zsh)
# -----------------------------
shell /usr/bin/zsh

include themes/noctalia.conf
