[main]
include=~/.config/foot/themes/noctalia
# Primary font + Tamil fallback (replaces font_family, font_size, and symbol_map)
# Bold and italic variants are detected automatically by default
font=JetBrainsMonoNL Nerd Font:size=13.6,Noto Sans Tamil:size=13.6

# Window padding in pixels (closest whole-pixel equivalent to 2.5)
pad=8x3

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
blink-rate=500

[colors-dark]
# Background opacity (replaces background_opacity 0.8)
alpha=0.8

[csd]
# Hides titlebars/decorations (replaces hide_window_decorations titlebar-only)
preferred=none
size=0
